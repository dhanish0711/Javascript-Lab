<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grading System</title>
    <link rel="stylesheet" href="Experiment 3.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <h2>Student Grading System</h2>
            <form id="gradingForm">
                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input type="text" id="name" placeholder="Enter student name">
                </div>

                <div class="form-group">
                    <label for="marks">Marks</label>
                    <input type="number" id="marks" placeholder="Enter marks (0-100)" min="0" max="100">
                </div>

                <input type="button" class="btn" value="Calculate Grade" onclick="gradeSystem()">
            </form>

            <div id="report"></div>
        </div>

        <footer style="text-align: center; margin-top: 30px; font-size: 14px; color: gray; border-top: 1px solid lightgray; padding-top: 15px;">
            Made by Dhanish Ladwani PRN - 24070521020
        </footer>
    </div>

    <script src="Experiment 3.js"></script>
</body>

</html>
