<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 6 - Case Studies</title>
    <link rel="stylesheet" href="Case Study 6.css">
</head>
<body>
    <div class="container">
        <h2>Experiment 6 - Case Studies</h2>

        <div class="box">
            <h3>Case Study 1: Reverse a String</h3>
            <label for="strInput"><b>Enter a String:</b></label><br>
            <input type="text" id="strInput" placeholder="Enter string to reverse">
            <br>
            <button onclick="reverseString()">Reverse String</button>
            <div id="result"></div>
        </div>

        <div class="box">
            <h3>Case Study 2: Vowel Counter in Paragraph</h3>
            <label for="paragraphInput"><b>Enter a Paragraph:</b></label><br>
            <textarea id="paragraphInput" rows="4" placeholder="Enter a paragraph to count vowels..."></textarea>
            <br>
            <button onclick="countVowels()">Count Vowels</button>
            <div id="vowelResult"></div>
        </div>

        <footer style="text-align: center; margin-top: 30px; font-size: 14px; color: gray; border-top: 1px solid lightgray; padding-top: 15px;">
            Made by Dhanish Ladwani PRN - 24070521020
        </footer>
    </div>

    <script src="Case Study 6.js"></script>
</body>
</html>
