<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Registration Number Validator</title>
    <link rel="stylesheet" href="Case Study 4.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Vehicle Registration Validator</h2>
            <label for="regNo">Enter Vehicle Registration Number:</label>
            <input type="text" id="regNo" placeholder="e.g., MH31AB1234">
            <input type="button" value="Validate Registration" onclick="validateVehicleRegistration()">
            <div id="result"></div>
        </div>

        <footer style="text-align: center; margin-top: 30px; font-size: 14px; color: gray; border-top: 1px solid lightgray; padding-top: 15px;">

        </footer>
    </div>

    <script src="Case Study 4.js"></script>
