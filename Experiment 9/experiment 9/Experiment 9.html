<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Preferences</title>
    <link rel="stylesheet" href="Experiment 9.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Theme Preferences</h2>
        <p class="subtitle">Using localStorage and sessionStorage to save user preferences.</p>

        <div class="button-group">
            <button id="lightBtn" onclick="setTheme('light')">Light Theme</button>
            <button id="darkBtn" onclick="setTheme('dark')">Dark Theme</button>
            <button id="clearBtn" onclick="clearPreference()">Clear Preference</button>
        </div>

        <footer>
            Made by Dhanish Ladwani PRN - 24070521020
        </footer>
    </div>

    <script src="Experiment 9.js"></script>
</body>
</html>
